name: Lint and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

      - name: Build project
        run: bun run build
fallow:
  name: Fallow analysis
  runs-on: ubuntu-latest
  permissions:
    contents: read
    security-events: write   
  steps:
    - uses: actions/checkout@v4
    - uses: fallow-rs/fallow@v3
      with:
        format: sarif
